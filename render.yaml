services:
  # Backend Service
  - type: web
    name: resume-matching-project
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r Backend/requirements.txt && python -c \"import nltk; nltk.download('punkt', quiet=True); nltk.download('stopwords', quiet=True); nltk.download('punkt_tab', quiet=True)\""
    startCommand: "gunicorn --preload --workers 2 --threads 2 --timeout 120 Backend.app:app"
    envVars:
      - key: PYTHONPATH
        value: "."
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_DEBUG
        value: "false"
      - key: NLTK_DATA
        value: "/opt/render/project/nltk_data"

  # Frontend Service
  - type: web
    name: resume-matching-project-ui
    env: static
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_API_URL
        value: "https://resume-matching-project.onrender.com"
